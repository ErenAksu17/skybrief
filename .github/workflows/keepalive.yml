name: keep-alive

# SkyBrief'i Render free tier'da uyanık tutar: /api/health'i düzenli pingler.
# Not: GitHub, 60 gün repo hareketsiz kalırsa zamanlanmış workflow'ları devre dışı
# bırakır — repo'da düzenli commit varsa sorun olmaz.

on:
  schedule:
    - cron: "*/10 * * * *"   # her ~10 dakikada bir (GitHub yoğunlukta geciktirebilir)
  workflow_dispatch:          # elle de tetiklenebilir (Actions sekmesinden)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: >
          curl -fsS --max-time 120 --retry 3 --retry-all-errors --retry-delay 20
          https://skybrief.onrender.com/api/health
